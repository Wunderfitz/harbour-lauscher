<!-- Cover action icon: listening mode Sound leakage reduction. The sound
     runs into a wall instead of escaping. A struck-through wave was tried
     first and turned to mush at 48 px, which is the size this is drawn at. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="48" height="48" viewBox="0 0 48 48">
  <rect x="7" y="15" width="12" height="18" rx="6" ry="6" fill="#000000"/>
  <path d="M 25.36 17.64 C 28.88 21.15 28.88 26.85 25.36 30.36" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <rect x="32" y="10" width="5" height="28" rx="2.5" ry="2.5" fill="#000000"/>
</svg>
